# auto-generated by grc.converter
# Modified to add CSI output message port for ISAC/sensing applications

id: ieee802_11_frame_equalizer
label: WiFi Frame Equalizer
category: '[IEEE802.11]'

parameters:
-   id: algo
    label: Algorithm
    dtype: raw
    default: ieee802_11.LS
-   id: freq
    label: Frequency
    dtype: real
    default: 5.89e9
-   id: bw
    label: Bandwidth
    dtype: real
    default: 10e6
-   id: log
    label: Log
    dtype: bool
    default: 'False'
    options: ['True', 'False']
    option_labels: [Enable, Disable]
-   id: debug
    label: Debug
    dtype: bool
    default: 'False'
    options: ['True', 'False']
    option_labels: [Enable, Disable]

inputs:
-   domain: stream
    dtype: complex
    vlen: 64
    multiplicity: '1'

outputs:
-   domain: stream
    dtype: byte
    vlen: 48
    multiplicity: '1'
-   domain: message
    id: symbols
    optional: true
# ============================================================
# CSI output port - Added for ISAC/sensing applications
# Outputs channel state information (H) for each detected frame
# Format: pmt::cons(metadata_dict, csi_c32vector)
# ============================================================
-   domain: message
    id: csi
    optional: true

templates:
    imports: import ieee802_11
    make: ieee802_11.frame_equalizer(${algo}, ${freq}, ${bw}, ${log}, ${debug})
    callbacks:
    - set_algorithm(${algo})
    - set_frequency(${freq})
    - set_bandwidth(${bw})

documentation: |-
    WiFi Frame Equalizer - Performs channel estimation and equalization for 802.11a/g/p frames.
    
    Parameters:
        Algorithm: Channel estimation algorithm (LS, LMS, COMB, STA)
        Frequency: Center frequency in Hz
        Bandwidth: Signal bandwidth in Hz
        Log: Enable logging
        Debug: Enable debug output
    
    Output Ports:
        out (stream): Decoded bits (48 bytes per OFDM symbol)
        symbols (message): Equalized constellation symbols
        csi (message): Channel State Information for sensing/ISAC applications
            Format: (metadata_dict, csi_vector)
            metadata_dict contains: timestamp, frequency, bandwidth, freq_offset, snr
            csi_vector: 64 complex values representing channel estimate H

file_format: 1
